    <!-- Google AdSense · 사이트 검토용 · chwippo-mobile WebView 안에서는 로드 X (Apple 4.2 방어) -->
    <script>
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var isNative =
            params.get('native') === '1' ||
            /chwippo-mobile-webview/i.test(navigator.userAgent) ||
            window.sessionStorage.getItem('chwippo:native-mode') === '1';
          if (isNative) return;
          var s = document.createElement('script');
          s.async = true;
          s.crossOrigin = 'anonymous';
          s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1653373526340159';
          document.head.appendChild(s);
        } catch (_) {
          // 실패 시 광고 안 로드 (안전 방향)
        }
      })();
    </script>
    <title>치뽀 — 취업 일정 관리</title>
    <script>
      // FOUC 방지 — React mount 전에 테마 적용 · chwippo-mobile 브릿지로 즉시 postMessage.
      // localStorage 우선 · 미설정 시 system (OS 설정 따름) · matchMedia change 실시간 감지.
      (function () {
        function resolve() {
          var stored = localStorage.getItem('chwippo-theme');
          var theme = stored === 'light' || stored === 'system' || stored === 'dark' ? stored : 'system';
          if (theme !== 'system') return theme;
          return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        function postTheme(t) {
          try {
            if (window.ReactNativeWebView) {
              window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'theme', theme: t }));
            }
          } catch (_) {}
        }
        function applyAndPost() {
          try {
            var resolved = resolve();
            document.documentElement.setAttribute('data-theme', resolved);
            postTheme(resolved);
          } catch (_) {
            document.documentElement.setAttribute('data-theme', 'dark');
            postTheme('dark');
          }
        }
        applyAndPost();
        // OS system dark/light 변경 실시간 감지 · 사용자가 'system' 모드일 때만 반응
        if (window.matchMedia) {
          try {
            var mq = window.matchMedia('(prefers-color-scheme: light)');
            var listener = function () {
              var stored = localStorage.getItem('chwippo-theme') || 'system';
              if (stored === 'system') applyAndPost();
            };
            if (mq.addEventListener) mq.addEventListener('change', listener);
            else if (mq.addListener) mq.addListener(listener);
          } catch (_) {}
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
